<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kerr Black Hole · Real-time General Relativistic Ray Tracing</title>
<style>
  :root {
    --fg: #e9ecf3;
    --dim: rgba(233, 236, 243, 0.55);
    --faint: rgba(233, 236, 243, 0.28);
    --glass: rgba(12, 14, 20, 0.58);
    --line: rgba(255, 255, 255, 0.08);
    --accent: #ffb366;
    --accent2: #8fc3ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--fg);
    font: 12px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; }
  canvas#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: grab; touch-action: none; }
  canvas#gl.drag { cursor: grabbing; }
  .ui { transition: opacity .5s ease; }
  body.hide-ui .ui { opacity: 0; pointer-events: none; }

  #title { position: fixed; left: 28px; top: 24px; pointer-events: none; }
  #title h1 { margin: 0; font-weight: 200; font-size: 22px; letter-spacing: .42em; text-transform: uppercase; color: #f4f1ea; }
  #title p { margin: 6px 0 0; font-size: 11px; letter-spacing: .12em; color: var(--dim); text-transform: uppercase; }

  #modes { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; padding: 3px;
    background: var(--glass); border: 1px solid var(--line); border-radius: 999px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  #modes button { all: unset; cursor: pointer; padding: 6px 14px; border-radius: 999px; font-size: 11px; letter-spacing: .08em; color: var(--dim); }
  #modes button:hover { color: var(--fg); }
  #modes button.on { background: rgba(255, 255, 255, 0.12); color: #fff; }
  #modes button.plunge.on { background: rgba(255, 140, 60, 0.25); }
  #toast .small { max-width: 80vw; margin-left: auto; margin-right: auto; }

  #panel { position: fixed; right: 18px; top: 18px; bottom: 18px; width: 300px; overflow-y: auto; overflow-x: hidden;
    background: var(--glass); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    padding: 6px 14px 14px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 3px; }
  body.panel-closed #panel { transform: translateX(340px); opacity: 0; pointer-events: none; }
  #panel { transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .35s; }
  #panelToggle { position: fixed; right: 18px; bottom: 18px; z-index: 5; display: none; }
  body.panel-closed #panelToggle { display: block; }

  details { border-bottom: 1px solid var(--line); padding: 8px 0 10px; }
  details:last-of-type { border-bottom: 0; }
  summary { list-style: none; cursor: pointer; font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); padding: 4px 0 6px; user-select: none; display: flex; justify-content: space-between; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; color: var(--faint); font-size: 12px; letter-spacing: 0; }
  details[open] summary::after { content: "−"; }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 8px; margin: 7px 0; }
  .row label { color: rgba(233,236,243,.82); }
  .row .val { font: 11px ui-monospace, "SF Mono", Menlo, monospace; color: var(--accent); min-width: 48px; text-align: right; }
  .row input[type=range] { grid-column: 1 / -1; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 16px; background: transparent; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; background: linear-gradient(90deg, rgba(255,179,102,.75) var(--p, 50%), rgba(255,255,255,.14) var(--p, 50%)); border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgba(255,179,102,.25), 0 0 10px rgba(255,179,102,.5); }
  input[type=range]::-moz-range-track { height: 2px; background: rgba(255,255,255,.14); }
  input[type=range]::-moz-range-progress { height: 2px; background: rgba(255,179,102,.75); }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: #fff; }
  .toggle { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; cursor: pointer; user-select: none; }
  .toggle input { display: none; }
  .toggle .sw { width: 28px; height: 16px; border-radius: 8px; background: rgba(255,255,255,.14); position: relative; transition: background .2s; flex: none; }
  .toggle .sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: #cfd3dc; transition: transform .2s, background .2s; }
  .toggle input:checked + .sw { background: rgba(255,179,102,.55); }
  .toggle input:checked + .sw::after { transform: translateX(12px); background: #fff; }
  select { width: 100%; background: rgba(255,255,255,.06); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; margin-top: 4px; }
  select option { background: #151821; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
  .btn { all: unset; cursor: pointer; text-align: center; padding: 7px 8px; border-radius: 9px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: rgba(233,236,243,.9); font-size: 11px; transition: background .15s, border-color .15s; }
  .btn:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.18); }
  .btn.warm { border-color: rgba(255,150,70,.35); background: rgba(255,130,50,.12); }
  .btn.wide { grid-column: 1 / -1; }
  .note { color: var(--faint); font-size: 10.5px; margin: 4px 0 2px; line-height: 1.5; }

  #hud { position: fixed; left: 26px; bottom: 22px; font: 11px/1.65 ui-monospace, "SF Mono", Menlo, monospace; color: var(--dim); pointer-events: none; white-space: pre; }
  #hud b { color: #f2efe8; font-weight: 500; }
  #hud .hot { color: var(--accent); }
  #hud .cool { color: var(--accent2); }

  #diagramBox { position: fixed; right: 336px; bottom: 18px; width: 236px; padding: 10px 10px 8px; background: var(--glass); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  body.panel-closed #diagramBox { right: 18px; bottom: 64px; }
  #diagramBox h3 { margin: 0 0 6px; font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); font-weight: 500; display: flex; justify-content: space-between; }
  #diagramBox h3 span { cursor: pointer; color: var(--faint); letter-spacing: 0; }
  #diagram { width: 216px; height: 216px; display: block; }
  #diagramLegend { font-size: 9.5px; color: var(--faint); margin-top: 5px; line-height: 1.5; }
  #diagramLegend i { display: inline-block; width: 10px; height: 2px; vertical-align: middle; margin-right: 4px; }
  body.no-diagram #diagramBox { display: none; }

  #hint { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); font-size: 11px; color: var(--faint); letter-spacing: .04em; pointer-events: none; transition: opacity 1.2s; white-space: nowrap; }
  #toast { position: fixed; left: 50%; top: 15%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity .8s; }
  #toast.show { opacity: 1; }
  #toast .big { font-weight: 200; font-size: 30px; letter-spacing: .3em; text-transform: uppercase; color: #fff; text-shadow: 0 0 30px rgba(0,0,0,.8); }
  #toast .small { margin-top: 10px; font-size: 12px; letter-spacing: .1em; color: rgba(255,255,255,.7); text-shadow: 0 0 12px rgba(0,0,0,.9); }
  #plungeHud { position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%); text-align: center; pointer-events: none; display: none;
    font: 12px/1.6 ui-monospace, "SF Mono", Menlo, monospace; color: rgba(255,255,255,.85); text-shadow: 0 0 10px #000; }
  #plungeHud .r { font: 200 34px/1.1 -apple-system, system-ui, sans-serif; letter-spacing: .08em; color: #fff; }
  #plungeHud .inside { color: #ff9a5c; letter-spacing: .2em; text-transform: uppercase; font-size: 11px; }
  body.plunging #plungeHud { display: block; }
  #ehtLabel { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); font-size: 11px; letter-spacing: .15em; color: rgba(255,210,160,.8); text-transform: uppercase; display: none; pointer-events: none; }
  body.eht #ehtLabel { display: block; }

  .trow { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  #infoBtn, #lang, #object { pointer-events: auto; }
  body.hide-ui #infoBtn, body.hide-ui #lang, body.hide-ui #object { pointer-events: none; }
  #lang, #object { display: flex; gap: 2px; padding: 2px; background: var(--glass); border: 1px solid var(--line); border-radius: 999px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  #lang button, #object button { all: unset; cursor: pointer; padding: 4px 9px; border-radius: 999px; font-size: 10px; letter-spacing: .1em; color: var(--dim); white-space: nowrap; }
  #lang button:hover, #object button:hover { color: var(--fg); }
  #lang button.on, #object button.on { background: rgba(255, 255, 255, 0.12); color: #fff; }
  #object button[data-object="ton618"].on { background: rgba(120, 170, 255, 0.28); }
  body.quasar #title h1 { color: #e8f0ff; }
  #rec { position: fixed; left: 28px; top: 128px; z-index: 6; display: none; align-items: center; gap: 8px; cursor: pointer;
    padding: 5px 12px 5px 10px; border-radius: 999px; background: rgba(40, 8, 8, 0.7); border: 1px solid rgba(255, 90, 90, 0.4);
    font: 11px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .08em; color: #ffd6d6; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #rec i { width: 8px; height: 8px; border-radius: 50%; background: #ff4d4d; animation: recpulse 1.2s ease-in-out infinite; }
  body.recording #rec { display: flex; }
  body.recording.hide-ui #rec { opacity: .4; }
  @keyframes recpulse { 50% { opacity: .25; } }
  #info { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 8; background: rgba(0,0,0,.35); }
  body.show-info #info { display: flex; }
  #info .card { width: min(680px, calc(100vw - 40px)); max-height: calc(100vh - 60px); overflow-y: auto; padding: 26px 30px 22px;
    background: rgba(12, 14, 20, 0.82); border: 1px solid var(--line); border-radius: 18px; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    font-size: 12.5px; line-height: 1.6; color: rgba(233,236,243,.86); }
  #info h2 { margin: 0 0 4px; font-weight: 300; font-size: 18px; letter-spacing: .28em; text-transform: uppercase; color: #fff; }
  #info .sub { color: var(--dim); font-size: 11px; letter-spacing: .08em; margin-bottom: 14px; }
  #info h4 { margin: 14px 0 3px; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); font-weight: 500; }
  #info p { margin: 0; }
  #info .keys { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--dim); font-size: 11px; }
  #info .close { float: right; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; background: #000; z-index: 10; transition: opacity 1.2s; }
  #loading .ring { width: 54px; height: 54px; border-radius: 50%; border: 1px solid rgba(255,180,110,.15); border-top-color: rgba(255,180,110,.9); animation: spin 1.1s linear infinite; }
  #loading p { margin-top: 18px; font-size: 11px; letter-spacing: .25em; text-transform: uppercase; color: var(--dim); }
  @keyframes spin { to { transform: rotate(360deg); } }
  #error { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 40px; font-size: 14px; color: #ffb3a0; background: #000; z-index: 20; }

  @media (max-width: 900px) {
    #panel { width: calc(100vw - 36px); top: auto; height: 52vh; }
    #diagramBox { display: none; }
    #title { left: 18px; top: 16px; }
    #title h1 { font-size: 14px; letter-spacing: .3em; }
    #title p { display: none; }
    #modes { top: auto; bottom: 18px; left: 18px; transform: none; }
    body:not(.panel-closed) #modes { display: none; }
    #modes button { padding: 6px 10px; white-space: nowrap; }
    #hud, #hint { display: none; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="title" class="ui">
  <h1 data-i18n="ui.title"></h1>
  <p data-i18n="ui.subtitle"></p>
  <div class="trow">
    <button id="infoBtn" class="btn" data-i18n="ui.info"></button>
    <div id="object" role="group" data-i18n-title="ui.object"><button data-object="kerr">KERR</button><button data-object="ton618">TON 618</button></div>
    <div id="lang" role="group" data-i18n-title="ui.language"><button data-lang="en">EN</button><button data-lang="tr">TR</button></div>
  </div>
</div>

<div id="modes" class="ui">
  <button data-mode="cinematic" data-i18n="mode.cinematic"></button>
  <button data-mode="orbit" data-i18n="mode.orbit"></button>
  <button data-mode="plunge" class="plunge" data-i18n="mode.plunge"></button>
  <button data-mode="tour" data-i18n="mode.tour"></button>
</div>

<div id="panel" class="ui"></div>
<button id="panelToggle" class="btn ui" data-i18n="ui.settings"></button>

<div id="diagramBox" class="ui">
  <h3><div data-i18n="diag.title"></div><span id="diagramClose" data-i18n-title="diag.hide">×</span></h3>
  <canvas id="diagram" width="432" height="432"></canvas>
  <div id="diagramLegend"></div>
</div>

<div id="hud" class="ui"></div>
<div id="hint" class="ui" data-i18n="ui.hint"></div>
<div id="ehtLabel" data-i18n="ui.eht"></div>
<div id="rec" role="button" tabindex="0" data-i18n-title="rec.stopHint"><i></i><span id="recText"></span></div>
<div id="plungeHud"></div>
<div id="toast"><div class="big"></div><div class="small"></div></div>
<div id="info">
  <div class="card">
    <button class="btn close" id="infoClose" data-i18n="ui.close"></button>
    <h2 data-i18n="info.title"></h2>
    <div class="sub" data-i18n="info.sub"></div>
    <h4 data-i18n="info.ray.h"></h4>
    <p data-i18n="info.ray.p"></p>
    <h4 data-i18n="info.shadow.h"></h4>
    <p data-i18n="info.shadow.p"></p>
    <h4 data-i18n="info.lens.h"></h4>
    <p data-i18n="info.lens.p"></p>
    <h4 data-i18n="info.color.h"></h4>
    <p data-i18n="info.color.p"></p>
    <h4 data-i18n="info.disk.h"></h4>
    <p data-i18n="info.disk.p"></p>
    <h4 data-i18n="info.fall.h"></h4>
    <p data-i18n="info.fall.p"></p>
    <h4 data-i18n="info.ton.h"></h4>
    <p data-i18n="info.ton.p"></p>
    <h4 data-i18n="info.valid.h"></h4>
    <p data-i18n="info.valid.p"></p>
    <div class="keys" data-i18n="info.keys"></div>
  </div>
</div>
<div id="loading"><div class="ring"></div><p data-i18n="ui.loading"></p></div>
<div id="error"></div>

<script src="js/i18n.js"></script>
<script src="js/physics.js"></script>
<script src="js/shaders.js"></script>
<script src="js/main.js"></script>
</body>
</html>
